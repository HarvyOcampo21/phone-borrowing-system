<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" />
    <title>Phone Borrowing — Agent Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --bg: #eef1f6;
        --card: #fff;
        --primary: #2563eb;
        --primary-dk: #1d4ed8;
        --primary2: #93c5fd;
        --accent: #64748b;
        --neutral: #eef1f6;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e2e8f0;
        --green: #16a34a;
        --amber: #d97706;
        --red: #dc2626;
        --shadow: 0 2px 14px rgba(30, 41, 59, 0.07);
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 20px 14px 60px;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
      }

      /* ---------- header ---------- */
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 6px;
      }
      .logo-line {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-icon {
        width: 40px;
        height: 40px;
        background: var(--primary);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3);
        flex-shrink: 0;
      }
      h1 {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: -0.01em;
        font-size: clamp(1.2rem, 5vw, 1.55rem);
        color: var(--text);
      }
      .subtitle {
        margin: 2px 0 0;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.09em;
        color: var(--muted);
        text-transform: uppercase;
      }
      #authBox {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 6px;
      }
      .agent-pill {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
      }
      .btn-link {
        background: none;
        border: none;
        color: var(--primary);
        font-weight: 600;
        font-size: 13.5px;
        cursor: pointer;
        padding: 6px 8px;
        border-radius: 8px;
        font-family: inherit;
      }
      .btn-link:hover {
        background: rgba(37, 99, 235, 0.08);
      }
      .live-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--muted);
        margin: 10px 0 16px;
      }
      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        flex-shrink: 0;
      }

      /* ---------- cards ---------- */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
        box-shadow: var(--shadow);
        margin-bottom: 14px;
      }
      .card-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 14px;
      }

      /* ---------- notice ---------- */
      .notice {
        display: none;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 13.5px;
        font-weight: 600;
        margin-bottom: 14px;
      }
      .notice.show {
        display: flex;
      }
      .notice.warn {
        background: #fef2f2;
        color: var(--red);
        border: 1px solid #fecaca;
      }

      /* ---------- grid legend / topline ---------- */
      .grid-topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .grid-topline .card-title {
        margin: 0;
      }
      .grid-legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .grid-legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
        display: inline-block;
      }
      .dot-available {
        background: var(--green);
      }
      .dot-overdue {
        background: var(--red);
      }
      .dot-deployed {
        background: var(--amber);
        animation: pulseDot 1.4s ease-in-out infinite;
      }
      .dot-locked {
        background: #94a3b8;
      }
      @keyframes pulseDot {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.55);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(217, 119, 6, 0);
        }
      }

      /* ---------- return bar (active-session banner above grid) ---------- */
      .return-bar {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 16px;
      }
      .return-bar.show {
        display: flex;
      }
      .return-bar-info {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 700;
        color: var(--primary-dk);
      }
      .return-badge {
        display: none;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--red);
        background: #fee2e2;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .return-badge.show {
        display: inline-block;
      }
      .btn-return {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }
      .btn-return:hover {
        background: var(--primary-dk);
      }

      /* ---------- phone grid ---------- */
      .phone-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
        gap: 10px;
        overflow-y: auto;
        padding-right: 2px;
      }
      @media (max-width: 639px) {
        .phone-grid {
          max-height: 290px;
        }
      }
      @media (min-width: 640px) and (max-width: 1023px) {
        .phone-grid {
          grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
          max-height: 480px;
        }
      }
      @media (min-width: 1024px) and (max-width: 1439px) {
        .phone-grid {
          grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
          max-height: 950px;
        }
      }
      @media (min-width: 1440px) {
        .phone-grid {
          grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
          max-height: 1900px;
        }
      }
      .phone-cell {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 12px 6px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s, transform 0.1s, background 0.15s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        user-select: none;
      }
      .phone-cell:hover {
        border-color: var(--primary2);
        transform: translateY(-1px);
      }
      .phone-cell:active {
        transform: translateY(0);
      }
      .cell-icon {
        font-size: 18px;
        line-height: 1;
      }
      .cell-serial {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
      }
      .cell-status {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 600;
        color: var(--muted);
      }
      .cell-mine {
        border: 2px solid var(--primary);
        background: #eff6ff;
      }
      .cell-mine .cell-status {
        color: var(--primary-dk);
      }
      .cell-locked {
        background: #f1f5f9;
        cursor: not-allowed;
        opacity: 0.7;
      }
      .cell-locked:hover {
        transform: none;
        border-color: var(--border);
      }
      .grid-footnote {
        margin: 14px 2px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .grid-loading {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--muted);
        font-size: 13.5px;
        padding: 20px 0;
      }

      /* ---------- borrow / return screens ---------- */
      .device-summary {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 18px;
      }
      .device-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #fff7ed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
        border: 1px solid var(--border);
      }
      .device-unit {
        font-size: 17px;
        font-weight: 800;
        color: var(--text);
      }
      .device-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        padding: 12px 13px;
        border-radius: 10px;
        border: 1.5px solid var(--border);
        background: #f8fafc;
        font-size: 14.5px;
        font-family: inherit;
        color: var(--text);
      }
      .field input:focus {
        outline: none;
        border-color: var(--primary);
        background: #fff;
      }
      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 4px 0 16px;
      }
      .two-btn-row {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .btn {
        flex: 1;
        padding: 13px 14px;
        border-radius: 11px;
        font-weight: 700;
        font-size: 14.5px;
        cursor: pointer;
        border: none;
        font-family: inherit;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-primary,
      .btn-borrow {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover,
      .btn-borrow:hover {
        background: var(--primary-dk);
      }
      .btn-secondary {
        background: #f1f5f9;
        color: var(--text);
      }
      .btn-secondary:hover {
        background: #e2e8f0;
      }

      /* ---------- login modal ---------- */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal-box {
        background: #fff;
        border-radius: 20px;
        padding: 26px 24px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .modal-title {
        margin: 0;
        text-align: center;
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
      }
      .modal-sub {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        margin: 4px 0 20px;
      }
      .modal-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
        font-size: 12.5px;
      }
      .check-label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-weight: 500;
        cursor: pointer;
      }
      .check-label input {
        width: auto;
      }
      .link-sm {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }
      .modal-cancel {
        display: block;
        margin: 14px auto 0;
      }
      .field-error {
        color: var(--red);
        font-size: 12.5px;
        font-weight: 600;
        min-height: 16px;
        margin: -6px 0 10px;
      }

      /* ---------- toast ---------- */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%) translateY(20px);
        background: var(--text);
        color: #fff;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 13.5px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 60;
        max-width: 90vw;
        text-align: center;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #toast.success {
        background: #166534;
      }
      #toast.error {
        background: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <div class="logo-line">
            <div class="logo-icon">📱</div>
            <div>
              <h1>Phone Borrowing System</h1>
              <p class="subtitle">Agent Portal</p>
            </div>
          </div>
        </div>
        <div id="authBox"></div>
      </header>

      <div class="live-bar">
        <span class="live-dot"></span>
        <span id="liveLabel">Live</span>
      </div>

      <div class="notice warn" id="lockedNotice">
        <span>⚠️</span>
        <span id="lockedNoticeText"></span>
      </div>

      <!-- ===== GRID SCREEN ===== -->
      <div id="screenGrid" class="screen">
        <div class="card">
          <div class="grid-topline">
            <p class="card-title">📱 Phones</p>
            <div class="grid-legend">
              <span><span class="dot dot-available"></span>Available</span>
              <span><span class="dot dot-overdue"></span>Overdue</span>
              <span><span class="dot dot-deployed"></span>Deployed</span>
            </div>
          </div>

          <div class="return-bar" id="returnBar">
            <div class="return-bar-info">
              <span id="borrowedUnitLabel"></span>
              <span class="return-badge" id="returnBadge"></span>
            </div>
            <button class="btn-return" onclick="openReturn()">
              ↩️ Return Phone
            </button>
          </div>

          <div class="phone-grid" id="phoneGrid">
            <p class="grid-loading">Loading phones…</p>
          </div>
          <p class="grid-footnote" id="gridFootnote"></p>
        </div>
      </div>

      <!-- ===== BORROW SCREEN ===== -->
      <div id="screenBorrow" class="screen" style="display: none">
        <div class="card">
          <p class="card-title">📲 Borrow Device</p>
          <div class="device-summary">
            <div class="device-icon">📱</div>
            <div>
              <div class="device-unit" id="borrowUnitLabel"></div>
              <div class="device-sub">SN: <span id="borrowSerial"></span></div>
            </div>
          </div>
          <div class="field">
            <label>Purpose of Borrowing</label>
            <input
              list="purposeOptions"
              id="purposeInput"
              placeholder="Select or enter purpose…"
              autocomplete="off"
            />
            <datalist id="purposeOptions">
              <option value="Client calls"></option>
              <option value="Property viewing"></option>
              <option value="Client follow-up"></option>
              <option value="Site visit"></option>
            </datalist>
          </div>
          <div class="two-btn-row">
            <button class="btn btn-secondary" onclick="cancelBorrow()">
              Cancel
            </button>
            <button
              class="btn btn-borrow"
              id="borrowConfirmBtn"
              onclick="confirmBorrow()"
            >
              Borrow
            </button>
          </div>
        </div>
      </div>

      <!-- ===== RETURN SCREEN ===== -->
      <div id="screenReturn" class="screen" style="display: none">
        <div class="card">
          <p class="card-title">↩️ Return Device</p>
          <div class="notice warn" id="returnOverdueNotice">
            <span>⚠️</span>
            <span id="returnOverdueText"></span>
          </div>
          <div class="device-summary">
            <div class="device-icon">📱</div>
            <div>
              <div class="device-unit" id="returnUnitLabel"></div>
              <div class="device-sub">🟢 Borrowed</div>
            </div>
          </div>
          <hr class="divider" />
          <p class="card-title" style="margin-top: 4px">📞 Call Details</p>
          <div class="field">
            <label>Total Calls Made</label>
            <input
              type="number"
              id="callsTotal"
              min="0"
              inputmode="numeric"
              placeholder="Enter number"
            />
          </div>
          <div class="field">
            <label>Successful Calls</label>
            <input
              type="number"
              id="callsSuccess"
              min="0"
              inputmode="numeric"
              placeholder="Enter number"
            />
          </div>
          <div class="two-btn-row">
            <button class="btn btn-secondary" onclick="cancelReturn()">
              Cancel
            </button>
            <button
              class="btn btn-primary"
              id="returnConfirmBtn"
              onclick="confirmReturn()"
            >
              Submit Return
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== LOGIN MODAL ===== -->
    <div class="modal-overlay" id="loginOverlay">
      <div class="modal-box">
        <div class="logo-line" style="justify-content: center; margin-bottom: 14px">
          <div class="logo-icon">📱</div>
        </div>
        <h2 class="modal-title">Phone Borrowing System</h2>
        <p class="modal-sub">Please sign in to continue</p>
        <div class="field">
          <label>Email Address</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="you@company.com"
            autocomplete="username"
          />
        </div>
        <div class="field" style="margin-bottom: 6px">
          <label>Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter')submitLogin()"
          />
        </div>
        <div class="field-error" id="loginError"></div>
        <button class="btn btn-primary" id="loginBtn" onclick="submitLogin()" style="width: 100%">
          Sign In
        </button>
        <div class="modal-row">
          <label class="check-label">
            <input type="checkbox" id="keepSignedIn" checked />
            Keep me signed in
          </label>
          <a
            href="#"
            class="link-sm"
            onclick="toast('Contact your admin to reset your password.','info');return false;"
            >Forgot password?</a
          >
        </div>
        <button class="btn-link modal-cancel" onclick="closeLogin()">
          Cancel
        </button>
      </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/firebase-api.js"></script>

    <script>
      // How long (in hours) a borrow may run before it's flagged
      // Overdue on the grid and in the Return screen. Adjust freely.
      const OVERDUE_HOURS = 24;

      let currentAgent = null; // {name, team, email, activeBorrowUnit, activeRecordId}
      let allPhones = [];
      let activeRecord = null; // full record object for the agent's current borrow
      let selectedPhoneForBorrow = null;
      let pendingUnitAfterLogin = null;
      let toastTimer = null;

      window.addEventListener("load", () => {
        restoreSession();
        loadPhones();
        setInterval(refreshSilent, 20000);
      });

      // ---------- session ----------
      function saveSession(agent, remember) {
        const store = remember ? localStorage : sessionStorage;
        const other = remember ? sessionStorage : localStorage;
        store.setItem("pbs_agent", agent.name);
        other.removeItem("pbs_agent");
      }

      function restoreSession() {
        const name =
          localStorage.getItem("pbs_agent") ||
          sessionStorage.getItem("pbs_agent");
        if (!name) return;
        api({ action: "getAgent", name }).then(async (res) => {
          if (res.success) {
            currentAgent = res.agent;
            if (currentAgent.activeBorrowUnit) await loadActiveRecord();
            onAuthChanged();
          } else {
            clearSession();
          }
        });
      }

      function clearSession() {
        localStorage.removeItem("pbs_agent");
        sessionStorage.removeItem("pbs_agent");
        currentAgent = null;
        activeRecord = null;
        onAuthChanged();
      }

      function logout() {
        clearSession();
        showScreen("grid");
        toast("Logged out.", "info");
      }

      function onAuthChanged() {
        renderHeader();
        renderGrid();
      }

      // ---------- data ----------
      async function loadPhones() {
        try {
          const res = await api({ action: "getPhones" });
          allPhones = res.success ? res.phones : [];
          setLiveLabel();
        } catch {
          setLiveLabel("Connection error");
        }
        renderGrid();
      }

      async function refreshSilent() {
        try {
          const res = await api({ action: "getPhones" });
          if (res.success) allPhones = res.phones;
          if (currentAgent) {
            const ag = await api({ action: "getAgent", name: currentAgent.name });
            if (ag.success) currentAgent = ag.agent;
            if (currentAgent.activeBorrowUnit) await loadActiveRecord();
            else activeRecord = null;
          }
          setLiveLabel();
          // Don't refresh mid-borrow/return screen out from under the user.
          if (
            document.getElementById("screenBorrow").style.display === "none" &&
            document.getElementById("screenReturn").style.display === "none"
          ) {
            renderHeader();
            renderGrid();
          }
        } catch {
          /* silent */
        }
      }

      async function loadActiveRecord() {
        if (!currentAgent || !currentAgent.activeRecordId) {
          activeRecord = null;
          return;
        }
        const res = await api({
          action: "getRecord",
          recordId: currentAgent.activeRecordId,
        });
        activeRecord = res.success ? res.record : null;
      }

      function setLiveLabel(msg) {
        document.getElementById("liveLabel").textContent =
          msg || "Live · Updated " + new Date().toLocaleTimeString();
      }

      // ---------- rendering ----------
      function renderHeader() {
        const box = document.getElementById("authBox");
        if (currentAgent) {
          box.innerHTML =
            '<span class="agent-pill">👤 ' +
            escapeHtml(currentAgent.name) +
            '</span><button class="btn-link" onclick="logout()">⎋ Logout</button>';
        } else {
          box.innerHTML =
            '<button class="btn-link" onclick="openLogin()">Login</button>';
        }
      }

      function phoneState(p) {
        if (p.available) return { state: "available", mine: false };
        const mine = !!(currentAgent && p.borrowedBy === currentAgent.name);
        let overdue = false;
        if (p.borrowTime) {
          const hrs = (Date.now() - new Date(p.borrowTime).getTime()) / 3600000;
          overdue = hrs >= OVERDUE_HOURS;
        }
        return { state: overdue ? "overdue" : "deployed", mine };
      }

      function fmtDuration(ms) {
        if (ms < 0) ms = 0;
        const totalMin = Math.floor(ms / 60000);
        return Math.floor(totalMin / 60) + "h " + (totalMin % 60) + "m";
      }

      function renderGrid() {
        const grid = document.getElementById("phoneGrid");
        const locked = !!(currentAgent && currentAgent.activeBorrowUnit);
        document.getElementById("returnBar").classList.toggle("show", locked);
        const lockedNotice = document.getElementById("lockedNotice");
        lockedNotice.classList.remove("show");
        document.getElementById("returnBadge").classList.remove("show");

        if (locked) {
          document.getElementById("borrowedUnitLabel").textContent =
            "Unit " + currentAgent.activeBorrowUnit;
          if (activeRecord && activeRecord["Borrow Time"]) {
            const bt = new Date(activeRecord["Borrow Time"]);
            const hrs = (Date.now() - bt.getTime()) / 3600000;
            if (hrs >= OVERDUE_HOURS) {
              const overTxt = fmtDuration(
                Date.now() - bt.getTime() - OVERDUE_HOURS * 3600000
              );
              lockedNotice.classList.add("show");
              document.getElementById("lockedNoticeText").textContent =
                "This borrowing session is overdue by " +
                overTxt +
                ". Please return the phone as soon as possible.";
              const badge = document.getElementById("returnBadge");
              badge.textContent = "Overdue · " + overTxt;
              badge.classList.add("show");
            }
          }
        }

        if (!allPhones.length) {
          grid.innerHTML = '<p class="grid-loading">No phones found.</p>';
          document.getElementById("gridFootnote").textContent = "";
          return;
        }

        grid.innerHTML = allPhones
          .map((p) => {
            const st = phoneState(p);
            let cls = "phone-cell";
            let label = st.state.charAt(0).toUpperCase() + st.state.slice(1);
            let dotClass = "dot-" + st.state;

            if (locked) {
              if (st.mine) {
                cls += " cell-mine";
                label = "Borrowed";
              } else {
                cls += " cell-locked";
                label = "Unavailable";
                dotClass = "dot-locked";
              }
            }

            return (
              '<div class="' +
              cls +
              '" onclick="onPhoneClick(\'' +
              String(p.unitNo).replace(/'/g, "\\'") +
              '\')">' +
              '<div class="cell-icon">📱</div>' +
              '<div class="cell-serial">' +
              escapeHtml(p.serialNo || p.unitNo) +
              '</div>' +
              '<div class="cell-status"><span class="dot ' +
              dotClass +
              '"></span>' +
              label +
              "</div></div>"
            );
          })
          .join("");

        document.getElementById("gridFootnote").textContent =
          allPhones.length + (allPhones.length === 1 ? " phone total" : " phones total");
      }

      // ---------- phone click routing ----------
      function onPhoneClick(unitNo) {
        const p = allPhones.find((x) => String(x.unitNo) === String(unitNo));
        if (!p) return;

        if (currentAgent && currentAgent.activeBorrowUnit) {
          if (String(p.unitNo) === String(currentAgent.activeBorrowUnit)) {
            openReturn();
          } else {
            toast("Return your current phone before borrowing another.", "error");
          }
          return;
        }

        if (!p.available) {
          toast("This phone is currently borrowed.", "error");
          return;
        }

        if (!currentAgent) {
          pendingUnitAfterLogin = unitNo;
          openLogin();
          return;
        }

        openBorrow(p);
      }

      // ---------- login modal ----------
      function openLogin() {
        document.getElementById("loginOverlay").classList.add("show");
        document.getElementById("loginEmail").value = "";
        document.getElementById("loginPassword").value = "";
        document.getElementById("loginError").textContent = "";
        setTimeout(() => document.getElementById("loginEmail").focus(), 50);
      }

      function closeLogin() {
        document.getElementById("loginOverlay").classList.remove("show");
        pendingUnitAfterLogin = null;
      }

      async function submitLogin() {
        const email = document.getElementById("loginEmail").value.trim().toLowerCase();
        const password = document.getElementById("loginPassword").value;
        const remember = document.getElementById("keepSignedIn").checked;
        const err = document.getElementById("loginError");
        const btn = document.getElementById("loginBtn");
        err.textContent = "";

        if (!email || !password) {
          err.textContent = "Please enter both fields.";
          return;
        }

        btn.disabled = true;
        btn.textContent = "Signing in…";
        try {
          const res = await api({ action: "agentLogin", email, password });
          if (res.success) {
            currentAgent = res.agent;
            saveSession(currentAgent, remember);
            if (currentAgent.activeBorrowUnit) await loadActiveRecord();
            document.getElementById("loginOverlay").classList.remove("show");
            onAuthChanged();

            const pending = pendingUnitAfterLogin;
            pendingUnitAfterLogin = null;
            if (pending && !currentAgent.activeBorrowUnit) {
              const p = allPhones.find((x) => String(x.unitNo) === String(pending));
              if (p && p.available) openBorrow(p);
            }
          } else {
            err.textContent = res.message || "Invalid email or password.";
          }
        } catch {
          err.textContent = "Connection error. Please try again.";
        }
        btn.disabled = false;
        btn.textContent = "Sign In";
      }

      // ---------- screens ----------
      function showScreen(name) {
        document.getElementById("screenGrid").style.display = name === "grid" ? "" : "none";
        document.getElementById("screenBorrow").style.display = name === "borrow" ? "" : "none";
        document.getElementById("screenReturn").style.display = name === "return" ? "" : "none";
        // The top-of-page overdue banner only makes sense on the grid screen.
        if (name !== "grid") document.getElementById("lockedNotice").classList.remove("show");
        else renderGrid();
      }

      function openBorrow(p) {
        selectedPhoneForBorrow = p;
        document.getElementById("borrowUnitLabel").textContent = "Unit " + p.unitNo;
        document.getElementById("borrowSerial").textContent = p.serialNo || "—";
        document.getElementById("purposeInput").value = "";
        showScreen("borrow");
      }

      function cancelBorrow() {
        selectedPhoneForBorrow = null;
        showScreen("grid");
      }

      async function confirmBorrow() {
        const purpose = document.getElementById("purposeInput").value.trim();
        if (!purpose) {
          toast("Please enter the purpose of borrowing.", "error");
          return;
        }
        const btn = document.getElementById("borrowConfirmBtn");
        btn.disabled = true;
        try {
          const res = await api({
            action: "borrowPhone",
            agentName: currentAgent.name,
            unitNo: selectedPhoneForBorrow.unitNo,
            serialNo: selectedPhoneForBorrow.serialNo,
            notes: purpose,
          });
          if (res.success) {
            toast(res.message || "Phone borrowed successfully!", "success");
            const ag = await api({ action: "getAgent", name: currentAgent.name });
            if (ag.success) currentAgent = ag.agent;
            await loadActiveRecord();
            await loadPhones();
            onAuthChanged();
            showScreen("grid");
          } else {
            toast(res.message || "Could not borrow this phone.", "error");
          }
        } catch {
          toast("Connection error. Please try again.", "error");
        }
        btn.disabled = false;
      }

      function openReturn() {
        document.getElementById("returnUnitLabel").textContent =
          "Unit " + currentAgent.activeBorrowUnit;
        document.getElementById("callsTotal").value = "";
        document.getElementById("callsSuccess").value = "";

        const notice = document.getElementById("returnOverdueNotice");
        notice.classList.remove("show");
        if (activeRecord && activeRecord["Borrow Time"]) {
          const bt = new Date(activeRecord["Borrow Time"]);
          const hrs = (Date.now() - bt.getTime()) / 3600000;
          if (hrs >= OVERDUE_HOURS) {
            const overTxt = fmtDuration(Date.now() - bt.getTime() - OVERDUE_HOURS * 3600000);
            document.getElementById("returnOverdueText").textContent =
              "This session is overdue by " + overTxt + ". Please return the phone as soon as possible.";
            notice.classList.add("show");
          }
        }
        showScreen("return");
      }

      function cancelReturn() {
        showScreen("grid");
      }

      async function confirmReturn() {
        const totalVal = document.getElementById("callsTotal").value;
        const successVal = document.getElementById("callsSuccess").value;
        if (totalVal === "" || parseInt(totalVal) < 0) {
          toast("Enter the total number of calls made.", "error");
          return;
        }
        if (successVal === "" || parseInt(successVal) < 0) {
          toast("Enter the number of successful calls.", "error");
          return;
        }
        if (parseInt(successVal) > parseInt(totalVal)) {
          toast("Successful calls can't exceed total calls.", "error");
          return;
        }
        const btn = document.getElementById("returnConfirmBtn");
        btn.disabled = true;
        try {
          const res = await api({
            action: "returnPhone",
            unitNo: currentAgent.activeBorrowUnit,
            clientsCalled: parseInt(totalVal),
            successfulCalls: parseInt(successVal),
          });
          if (res.success) {
            toast(res.message || "Phone returned successfully!", "success");
            currentAgent.activeBorrowUnit = null;
            currentAgent.activeRecordId = null;
            activeRecord = null;
            await loadPhones();
            onAuthChanged();
            showScreen("grid");
          } else {
            toast(res.message || "Could not return this phone.", "error");
          }
        } catch {
          toast("Connection error. Please try again.", "error");
        }
        btn.disabled = false;
      }

      // ---------- helpers ----------
      function toast(msg, type) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.className = "";
        }, 3200);
      }

      function escapeHtml(s) {
        return (s ?? "").toString().replace(/[&<>"']/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[c]));
      }
    </script>
  </body>
</html>
